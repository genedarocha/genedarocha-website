<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t">
  <title id="t">A cross on a hilltop at sunrise, with rays of light breaking through the clouds</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.38" stop-color="#5b4fff"/>
      <stop offset="0.68" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.35" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4d6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a4a8c"/>
      <stop offset="1" stop-color="#3a2a5c"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f45"/>
      <stop offset="1" stop-color="#120e22"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="90" cy="60" r="1.6"/><circle cx="210" cy="120" r="1.1"/><circle cx="330" cy="40" r="1.4"/>
    <circle cx="470" cy="95" r="1"/><circle cx="760" cy="55" r="1.3"/><circle cx="880" cy="130" r="1"/>
    <circle cx="1010" cy="70" r="1.6"/><circle cx="1130" cy="110" r="1.1"/><circle cx="640" cy="30" r="1.2"/>
  </g>

  <!-- light rays from behind the hill -->
  <g transform="translate(600 470)" opacity="0.9">
    <polygon points="-18,0 18,0 260,-520 160,-520" fill="url(#ray)"/>
    <polygon points="-18,0 18,0 -160,-520 -260,-520" fill="url(#ray)"/>
    <polygon points="-14,0 14,0 520,-470 440,-520" fill="url(#ray)"/>
    <polygon points="-14,0 14,0 -440,-520 -520,-470" fill="url(#ray)"/>
    <polygon points="-10,0 10,0 40,-520 -40,-520" fill="url(#ray)"/>
    <polygon points="-12,0 12,0 700,-300 680,-380" fill="url(#ray)" opacity="0.6"/>
    <polygon points="-12,0 12,0 -680,-380 -700,-300" fill="url(#ray)" opacity="0.6"/>
  </g>

  <!-- sun -->
  <circle cx="600" cy="470" r="230" fill="url(#sun)"/>

  <!-- soft clouds -->
  <g fill="#ffe2c4" opacity="0.45" filter="url(#blur)">
    <ellipse cx="220" cy="330" rx="200" ry="26"/>
    <ellipse cx="1000" cy="300" rx="230" ry="24"/>
    <ellipse cx="380" cy="410" rx="160" ry="18"/>
    <ellipse cx="860" cy="420" rx="170" ry="18"/>
  </g>

  <!-- far hills -->
  <path d="M0 520 C 180 450, 330 470, 470 500 S 760 450, 900 480 S 1110 470, 1200 500 L1200 700 L0 700 Z" fill="url(#hillFar)"/>

  <!-- near hill with cross -->
  <path d="M0 610 C 200 590, 400 500, 600 468 C 800 500, 1000 590, 1200 600 L1200 700 L0 700 Z" fill="url(#hillNear)"/>

  <!-- cross -->
  <g filter="url(#glow)">
    <rect x="590" y="300" width="20" height="172" rx="2" fill="#120e22"/>
    <rect x="548" y="342" width="104" height="18" rx="2" fill="#120e22"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#1b1640" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M300 220 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M345 250 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M860 200 q9 -9 18 0 q9 -9 18 0"/>
  </g>
</svg>
