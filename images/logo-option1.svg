<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" class="gdr-logo-svg">
  <defs>
    <linearGradient id="gdr-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b4fff" />
      <stop offset="50%" stop-color="#8c52ff" />
      <stop offset="100%" stop-color="#00c896" />
    </linearGradient>
    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5c35" />
      <stop offset="100%" stop-color="#ff9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: GDR AI Hex-Core Crest -->
  <g transform="translate(6, 4)">
    <!-- Outer Hexagon Matrix -->
    <polygon points="24,2 44,13.5 44,36.5 24,48 4,36.5 4,13.5" fill="url(#gdr-grad-1)" fill-opacity="0.12" stroke="url(#gdr-grad-1)" stroke-width="2.2" stroke-linejoin="round" />
    
    <!-- Inner Neural Nodes & Circuit Lines -->
    <circle cx="24" cy="14" r="2.5" fill="#5b4fff" />
    <circle cx="14" cy="31" r="2.5" fill="#00c896" />
    <circle cx="34" cy="31" r="2.5" fill="#ff5c35" />
    <line x1="24" y1="14" x2="14" y2="31" stroke="#5b4fff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />
    <line x1="24" y1="14" x2="34" y2="31" stroke="#ff5c35" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />
    <line x1="14" y1="31" x2="34" y2="31" stroke="#00c896" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="2 2" />

    <!-- GDR Interlocking Center Geometry -->
    <path d="M19 19 H29 V23 H23 V27 H28 V31 H19 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- AI Core Dot -->
    <circle cx="24" cy="25" r="3.5" fill="url(#ai-glow)" filter="url(#glow)" />
  </g>

  <!-- Right: Typography "GDR" + "AI SYSTEMS" -->
  <g transform="translate(62, 12)">
    <!-- GDR Brand Monogram -->
    <text x="0" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" letter-spacing="0.08em" fill="currentColor" class="logo-text-primary">GDR</text>
    
    <!-- AI Tag Badge -->
    <rect x="62" y="5" width="30" height="18" rx="5" fill="url(#gdr-grad-1)" />
    <text x="77" y="18" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="10.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">AI</text>
    
    <!-- Subtitle: Systems Engineering -->
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="8.5" letter-spacing="0.22em" fill="#00c896" text-transform="uppercase">SYSTEMS ENGINEER</text>
  </g>
</svg>
